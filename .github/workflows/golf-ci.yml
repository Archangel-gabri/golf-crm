name: Golf synthetic CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/golf-ci-playwright-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up supported Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.21'
          python-version: '3.12.13'
          enable-cache: false

      - name: Check runtime prerequisites
        run: |
          node --version
          npm --version
          uv --version
          command -v rsync
          command -v python3
          uv python install 3.12.13

      - name: Install locked browser tooling
        run: |
          npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
          ./e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run complete synthetic gate
        run: env -u PYTEST_ADDOPTS bash scripts/test.sh
